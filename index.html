<script>
(function(){
  var t0=Date.now(),MIN=1800,MAX=20000,done=false,sp=document.getElementById('splash');
  function hide(){
    if(done)return;done=true;
    var w=Math.max(0,MIN-(Date.now()-t0));
    setTimeout(function(){sp.classList.add('out');setTimeout(function(){sp.remove()},700)},w);
  }
  // aplikasi mengirim sinyal setelah data selesai dimuat dan halaman pertama tergambar
  window.addEventListener('message',function(e){if(e.data==='simad-ready')hide()});
  // cadangan bila sinyal tidak datang (mis. jaringan lambat)
  setTimeout(hide,MAX);
})();
</script>
